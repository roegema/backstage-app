app:
  baseUrl: http://localhost:7007

auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

backend:
  baseUrl: http://localhost:7007
  listen:
    host: 0.0.0.0

  reading:
    allow:
      - host: roegema.github.io
        protocol: https

  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DB}

  cors:
    origin: http://localhost:7007
    credentials: true

  # # ✅ BELANGRIJK – alleen voor local dev
  # auth:
  #   dangerouslyDisableDefaultAuthPolicy: true
  #   externalAccess:
  #     - type: legacy
  #       options:
  #         secret: local-development-secret
  #         subject: local-dev

permission:
  enabled: false

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location]

  locations:
    - type: file
      target: ./catalog/entities/users.yaml
      rules:
        - allow: [User]

    - type: file
      target: ./catalog/entities/groups.yaml
      rules:
        - allow: [Group]

    - type: file
      target: ./catalog/entities/component.yaml
      rules:
        - allow: [Component]

    - type: url
      target: https://github.com/roegema/backstage-software-templates/blob/main/python-app/template/template.yaml
      rules:
        - allow: [Template]

techdocs:
  builder: external
  publisher:
    type: local

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

