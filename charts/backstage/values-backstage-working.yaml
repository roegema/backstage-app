postgresql:
  enabled: true

  auth:
    username: backstage
    password: backstage
    database: backstage

backstage:
  image:
    registry: ghcr.io
    repository: backstage/backstage
    tag: "1.42.0"

  appConfig:

    app:
      title: Backstage
      baseUrl: http://localhost:7007

    organization:
      name: Local Development

    backend:
      baseUrl: http://localhost:7007

    auth:
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true

    techdocs:
      builder: local
      generator:
        runIn: local
      publisher:
        type: local

    catalog:
      rules:
        - allow:
            - Component
            - API
            - Resource
            - System
            - Location
